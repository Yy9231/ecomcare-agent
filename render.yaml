services:
  - type: web
    name: ecomcare-api
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CHECKPOINT_DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: MODEL_CREDENTIALS_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_DEMO_MODE
        value: "true"
      - key: MODEL_ENABLED
        value: "false"
      - key: MODEL_PROVIDER
        value: "openai"
      - key: MODEL_API_KEY
        sync: false
      - key: MODEL_BASE_URL
        sync: false
      - key: MODEL_NAME
        sync: false
      - key: MODEL_TIMEOUT_SECONDS
        value: "30"
      - key: MODEL_MAX_RETRIES
        value: "2"
